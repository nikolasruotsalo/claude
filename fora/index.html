<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />

  <title>Förå Oy — RN Media Asiakasportaali</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet" />

  <script>
    // ============================================================
    //  PIN — change this single value to update the access code
    // ============================================================
    const ACCESS_PIN = "12345678";

    // ============================================================
    //  ✏️  EDIT HERE — update this object each month
    //  No other code needs to be touched.
    // ============================================================
    const CLIENT_DATA = {
      clientName: "Förå Oy",
      package: "Custom €75 (125) /kk",

      nextShootDate: "",          // e.g. "15.6.2025"
      videosDeliveredThisMonth: 0,
      videosTotal: 4,
      postsScheduled: 0,
      postsTotal: 4,
      nextReportDate: "",         // e.g. "30.6.2025"
      reportStatus: "Tulossa",    // "Tulossa" | "Valmis" | "Lähetetty"

      // Leave empty string to hide the monthly note box entirely

      // Formspree form ID for feedback emails

      contentItems: [
        // Example card — duplicate/edit as needed:
        // {

        //   platform: "TikTok",           // "TikTok" | "Instagram" | "Reels"

        //   thumbnailUrl: "",             // fallback thumbnail image URL
        //   caption: "Kuvateksti tähän.",
        //   status: "Odottaa",            // "Odottaa" | "Hyväksytty" | "Muutoksia pyydetty"
        // },
      ],
    };

  </script>

  <style>
    /* ── Reset & base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0a;
      --surface:   #141414;
      --surface2:  #1c1c1c;
      --border:    #2a2a2a;
      --accent:    #e8e0d0;
      --accent-dim:#b8b0a0;
      --green:     #2d5a3d;
      --green-light:#4caf7d;
      --red:       #5a2d2d;
      --red-light: #cf6679;
      --text:      #f0ede8;
      --text-muted:#888;
      --font-mono: 'DM Mono', monospace;
      --font-serif:'Playfair Display', serif;
      --radius:    8px;
      --transition: 0.25s ease;
    }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Animations ───────────────────────────────────────────── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pinShake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-8px); }
      40%,80% { transform: translateX(8px); }
    }
    .fade-in  { animation: fadeIn 0.5s ease both; }
    .fade-in-2{ animation: fadeIn 0.5s 0.1s ease both; }
    .fade-in-3{ animation: fadeIn 0.5s 0.2s ease both; }
    .fade-in-4{ animation: fadeIn 0.5s 0.3s ease both; }

    /* ── PIN SCREEN ───────────────────────────────────────────── */
    #pin-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      animation: fadeIn 0.4s ease;
    }
    #pin-screen .logo-text {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 3rem;
      opacity: 0.9;
    }
    #pin-screen h1 {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      font-weight: 400;
      color: var(--text);
      margin-bottom: 0.4rem;
      text-align: center;
    }
    #pin-screen p.sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      margin-bottom: 2.4rem;
      text-align: center;
    }

    /* PIN dots */
    #pin-dots {
      display: flex;
      gap: 10px;
      margin-bottom: 2rem;
    }
    .pin-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1.5px solid var(--accent-dim);
      background: transparent;
      transition: background var(--transition), border-color var(--transition);
    }
    .pin-dot.filled {
      background: var(--accent);
      border-color: var(--accent);
    }
    .pin-dot.error {
      border-color: var(--red-light);
      background: var(--red-light);
    }

    /* Numpad */
    #numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 280px;
    }
    .num-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 1.3rem;
      font-weight: 400;
      padding: 1.1rem 0;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition), transform 0.1s;
      user-select: none;
    }
    .num-btn:hover  { background: var(--surface2); border-color: var(--accent-dim); }
    .num-btn:active { transform: scale(0.94); }
    .num-btn.wide   { grid-column: span 2; font-size: 0.8rem; letter-spacing: 0.1em; }
    .num-btn.del    { font-size: 1rem; color: var(--text-muted); }

    #pin-error {
      margin-top: 1.2rem;
      font-size: 0.75rem;
      color: var(--red-light);
      letter-spacing: 0.08em;
      min-height: 1.2em;
      text-align: center;
    }

    /* ── DASHBOARD ────────────────────────────────────────────── */
    #dashboard {
      display: none;
      min-height: 100vh;
      padding-bottom: 3rem;
    }
    #dashboard.visible { display: block; animation: fadeIn 0.5s ease; }

    /* Header */
    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.4rem 2rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 100;
      gap: 1rem;
    }
    .header-logo {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .header-center {
      text-align: center;
      flex: 1;
    }
    .header-client {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      font-weight: 400;
      color: var(--text);
    }
    .header-month {
      font-size: 0.68rem;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 1px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .pkg-badge {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--accent-dim);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.25rem 0.55rem;
      white-space: nowrap;
    }
    .logout-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.3rem 0.7rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: border-color var(--transition), color var(--transition);
    }
    .logout-btn:hover { border-color: var(--accent-dim); color: var(--text); }

    /* Main container */
    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* Stats row */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }
    @media (max-width: 720px) {
      .stats-row { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 420px) {
      .stats-row { grid-template-columns: 1fr; }
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.2rem 1.1rem 1rem;
    }
    .stat-label {
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    .stat-value {
      font-size: 1.6rem;
      font-weight: 500;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 0.2rem;
    }
    .stat-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 0.7rem;
    }
    .progress-bar {
      height: 2px;
      background: var(--border);
      border-radius: 1px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 1px;
      transition: width 0.8s ease;
    }
    .stat-text {
      font-size: 0.88rem;
      color: var(--text);
      margin-top: 0.1rem;
    }
    .stat-pill {
      display: inline-block;
      font-size: 0.68rem;
      padding: 0.15rem 0.5rem;
      border-radius: 20px;
      letter-spacing: 0.06em;
      margin-top: 0.35rem;
    }
    .pill-coming  { background: #1e2a1e; color: var(--green-light); }
    .pill-ready   { background: #1e2632; color: #6faed9; }
    .pill-sent    { background: #2a2218; color: #d4a843; }

    /* Monthly note */
    #monthly-note-box {
      background: #161410;
      border: 1px solid #3a3020;
      border-left: 3px solid var(--accent);
      border-radius: var(--radius);
      padding: 1rem 1.2rem;
      margin-bottom: 2rem;
      font-size: 0.88rem;
      color: var(--accent);
      display: none;
    }
    #monthly-note-box .note-label {
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent-dim);
      margin-bottom: 0.4rem;
    }

    /* Section title */
    .section-title {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    /* Content grid */
    #content-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.2rem;
    }
    .content-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    /* Content card */
    .content-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color var(--transition);
    }
    .content-card.approved  { border-color: var(--green-light); }
    .content-card.changes   { border-color: var(--red-light); }

    .card-media {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #111;
      overflow: hidden;
    }
    .card-media iframe,
    .card-media video {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .media-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--border);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      flex-direction: column;
      gap: 0.5rem;
    }
    .media-placeholder svg { opacity: 0.3; }

    .card-body {
      padding: 1rem;
    }
    .card-badges {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.7rem;
      flex-wrap: wrap;
    }
    .platform-badge {
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      font-weight: 500;
    }
    .platform-tiktok    { background: #1a1a2e; color: #69c9d0; border: 1px solid #2a2a4e; }
    .platform-instagram { background: #2a1a2e; color: #c77dff; border: 1px solid #4e2a5a; }
    .platform-reels     { background: #2a1a18; color: #ff9a9e; border: 1px solid #5a2a28; }

    .status-badge {
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
    }
    .status-waiting  { background: #1e1e1e; color: var(--text-muted); border: 1px solid var(--border); }
    .status-approved { background: var(--green);  color: var(--green-light); border: 1px solid #3d7a52; }
    .status-changes  { background: var(--red);    color: var(--red-light);   border: 1px solid #7a3d45; }

    .card-caption {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 0.9rem;
    }
    .card-approved-message {
      display: none;
      font-size: 0.75rem;
      color: var(--green-light);
      letter-spacing: 0.06em;
      text-align: center;
      padding: 0.5rem 0;
    }
    .card-actions {
      display: flex;
      gap: 0.6rem;
    }
    .btn {
      flex: 1;
      padding: 0.6rem 0.5rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition), color var(--transition);
    }
    .btn-approve {
      background: transparent;
      color: var(--green-light);
      border-color: var(--green);
    }
    .btn-approve:hover { background: var(--green); }
    .btn-changes {
      background: transparent;
      color: var(--red-light);
      border-color: var(--red);
    }
    .btn-changes:hover { background: var(--red); }

    .feedback-area {
      display: none;
      margin-top: 0.8rem;
    }
    .feedback-area textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      padding: 0.7rem;
      border-radius: var(--radius);
      resize: vertical;
      min-height: 80px;
      outline: none;
      line-height: 1.5;
    }
    .feedback-area textarea:focus { border-color: var(--accent-dim); }
    .btn-submit {
      margin-top: 0.5rem;
      width: 100%;
      background: var(--accent);
      color: var(--bg);
      border: none;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.6rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: opacity var(--transition);
    }
    .btn-submit:hover { opacity: 0.85; }
    .feedback-sent {
      display: none;
      font-size: 0.72rem;
      color: var(--green-light);
      text-align: center;
      padding: 0.4rem;
      margin-top: 0.5rem;
      letter-spacing: 0.06em;
    }

    /* Footer */
    .site-footer {
      text-align: center;
      padding: 2rem 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 2rem;
    }

    /* Mobile tweaks */
    @media (max-width: 560px) {
      .site-header { padding: 1rem; }
      .header-logo { font-size: 0.6rem; }
      .pkg-badge   { display: none; }
      .main        { padding: 1.2rem 1rem; }
    }
  </style>
</head>

<!-- ═══════════════════════════════════════════════════════════
     JAVASCRIPT
═══════════════════════════════════════════════════════════ -->
<script>
  // ── PIN logic ──────────────────────────────────────────────
  let pinInput = "";
  const PIN_LENGTH = 8;

  function pinPress(digit) {
    if (pinInput.length >= PIN_LENGTH) return;
    pinInput += digit;
    updateDots();
    if (pinInput.length === PIN_LENGTH) checkPin();
  }

  function pinDel() {
    pinInput = pinInput.slice(0, -1);
    updateDots();
    clearError();
  }

  function updateDots() {
    for (let i = 0; i < PIN_LENGTH; i++) {
      const dot = document.getElementById("dot-" + i);
      dot.classList.toggle("filled", i < pinInput.length);
      dot.classList.remove("error");
    }
  }

  function checkPin() {
    if (pinInput === ACCESS_PIN) {
      sessionStorage.setItem("fora_auth", "1");
      showDashboard();
    } else {
      showPinError();
    }
  }

  function showPinError() {
    const dots = document.querySelectorAll(".pin-dot");
    dots.forEach(d => { d.classList.remove("filled"); d.classList.add("error"); });
    document.getElementById("pin-error").textContent = "Väärä PIN-koodi. Yritä uudelleen.";
    document.getElementById("pin-dots").style.animation = "pinShake 0.4s ease";
    setTimeout(() => {
      document.getElementById("pin-dots").style.animation = "";
      dots.forEach(d => d.classList.remove("error"));
      document.getElementById("pin-error").textContent = "";
    }, 800);
    pinInput = "";
  }

  function clearError() {
    document.getElementById("pin-error").textContent = "";
  }

  // Keyboard support
  document.addEventListener("keydown", e => {
    if (document.getElementById("pin-screen").style.display === "none") return;
    if (e.key >= "0" && e.key <= "9") pinPress(e.key);
    if (e.key === "Backspace") pinDel();
  });

  // ── Session & routing ──────────────────────────────────────
  function logout() {
    sessionStorage.removeItem("fora_auth");
    document.getElementById("dashboard").classList.remove("visible");
    document.getElementById("pin-screen").style.display = "flex";
    pinInput = "";
    updateDots();
  }

  function showDashboard() {
    document.getElementById("pin-screen").style.display = "none";
    populateDashboard();
    document.getElementById("dashboard").classList.add("visible");
  }

  // ── Dashboard population ───────────────────────────────────
  function currentMonthFI() {
    const months = ["Tammikuu","Helmikuu","Maaliskuu","Huhtikuu","Toukokuu","Kesäkuu",
                    "Heinäkuu","Elokuu","Syyskuu","Lokakuu","Marraskuu","Joulukuu"];
    const now = new Date();
    return months[now.getMonth()] + " " + now.getFullYear();
  }

  function populateDashboard() {
    const d = CLIENT_DATA;

    // Header
    document.getElementById("hdr-client").textContent = d.clientName;
    document.getElementById("hdr-month").textContent  = currentMonthFI();
    document.getElementById("hdr-pkg").textContent    = d.package;
    document.getElementById("footer-year").textContent = new Date().getFullYear();

    // Stats — videos
    document.getElementById("stat-vid-num").textContent  = d.videosDeliveredThisMonth;
    document.getElementById("stat-vid-tot").textContent  = d.videosTotal;
    document.getElementById("stat-vid-sub").textContent  = "tässä kuussa";
    const vidPct = d.videosTotal > 0 ? (d.videosDeliveredThisMonth / d.videosTotal * 100) : 0;
    document.getElementById("prog-vid").style.width = Math.min(100, vidPct) + "%";

    // Stats — posts
    document.getElementById("stat-post-num").textContent = d.postsScheduled;
    document.getElementById("stat-post-tot").textContent = d.postsTotal;
    document.getElementById("stat-post-sub").textContent = "tässä kuussa";
    const postPct = d.postsTotal > 0 ? (d.postsScheduled / d.postsTotal * 100) : 0;
    document.getElementById("prog-post").style.width = Math.min(100, postPct) + "%";

    // Stats — shoot date
    document.getElementById("stat-shoot").textContent = d.nextShootDate || "—";

    // Stats — report
    document.getElementById("stat-report-date").textContent = d.nextReportDate ? "Pvm: " + d.nextReportDate : "";
    const pillEl = document.getElementById("stat-report-pill");
    const pillMap = {
      "Tulossa": ["pill-coming", "Tulossa"],
      "Valmis":  ["pill-ready",  "Valmis"],
      "Lähetetty":["pill-sent", "Lähetetty"],
    };
    const [cls, label] = pillMap[d.reportStatus] || ["pill-coming", d.reportStatus];
    pillEl.innerHTML = `<span class="stat-pill ${cls}">${label}</span>`;

    // Monthly note
    if (d.monthlyNote && d.monthlyNote.trim()) {
      document.getElementById("monthly-note-box").style.display = "block";
      document.getElementById("monthly-note-text").textContent = d.monthlyNote;
    }

    // Content grid
    buildContentGrid(d.contentItems || [], d.formspreeId);
  }

  function buildContentGrid(items, formspreeId) {
    const grid = document.getElementById("content-grid");
    grid.innerHTML = "";

    if (!items.length) {
      grid.innerHTML = '<div class="content-empty">Ei sisältöjä tällä hetkellä</div>';
      return;
    }

    items.forEach(item => {
      const card = document.createElement("div");
      card.className = "content-card";
      card.id = "card-" + item.id;

      const initStatus = item.status || "Odottaa";
      if (initStatus === "Hyväksytty")           card.classList.add("approved");
      else if (initStatus === "Muutoksia pyydetty") card.classList.add("changes");

      // Platform badge
      const platMap = {
        "TikTok":    "platform-tiktok",
        "Instagram": "platform-instagram",
        "Reels":     "platform-reels",
      };
      const platClass = platMap[item.platform] || "platform-tiktok";

      // Status badge
      const statusMap = {
        "Odottaa":              ["status-waiting",  "Odottaa"],
        "Hyväksytty":           ["status-approved", "Hyväksytty"],
        "Muutoksia pyydetty":   ["status-changes",  "Muutoksia pyydetty"],
      };
      const [stCls, stLabel] = statusMap[initStatus] || ["status-waiting", initStatus];

      // Media
      let mediaHTML = "";
      if (item.embedUrl) {
        // Detect YouTube / Vimeo / direct video
        if (/youtube\.com|youtu\.be/.test(item.embedUrl)) {
          const ytId = item.embedUrl.match(/(?:v=|youtu\.be\/)([^&?/]+)/)?.[1] || "";
          mediaHTML = `<iframe src="https://www.youtube.com/embed/${ytId}" allowfullscreen></iframe>`;
        } else if (/vimeo\.com/.test(item.embedUrl)) {
          const vmId = item.embedUrl.match(/vimeo\.com\/(\d+)/)?.[1] || "";
          mediaHTML = `<iframe src="https://player.vimeo.com/video/${vmId}" allowfullscreen></iframe>`;
        } else {
          mediaHTML = `<video src="${item.embedUrl}" controls playsinline></video>`;
        }
      } else if (item.thumbnailUrl) {
        mediaHTML = `<img src="${item.thumbnailUrl}" alt="Thumbnail" />`;
      } else {
        mediaHTML = `<div class="media-placeholder">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="2" y="2" width="20" height="20" rx="2"/><polygon points="10,8 16,12 10,16"/>
          </svg>
          <span style="font-size:0.62rem;letter-spacing:0.1em">Ei esikatselua</span>
        </div>`;
      }

      card.innerHTML = `
        <div class="card-media">${mediaHTML}</div>
        <div class="card-body">
          <div class="card-badges">
            <span class="platform-badge ${platClass}">${item.platform || ""}</span>
            <span class="status-badge ${stCls}" id="sbadge-${item.id}">${stLabel}</span>
          </div>
          <div class="card-caption">${item.caption || ""}</div>
          <div class="card-approved-message" id="approved-msg-${item.id}">✓ Hyväksytty</div>
          <div class="card-actions" id="actions-${item.id}">
            <button class="btn btn-approve" onclick="approveCard('${item.id}')">Hyväksyn</button>
            <button class="btn btn-changes" onclick="requestChanges('${item.id}')">Pyydän muutoksia</button>
          </div>
          <div class="feedback-area" id="feedback-${item.id}">
            <textarea placeholder="Kuvaile toivomasi muutokset..." id="textarea-${item.id}"></textarea>
            <button class="btn-submit" onclick="submitFeedback('${item.id}', '${formspreeId}', '${(item.caption || "").replace(/'/g,"\\'")}')">Lähetä palaute</button>
            <div class="feedback-sent" id="sent-${item.id}">✓ Palaute lähetetty!</div>
          </div>
        </div>
      `;

      // Restore state if already approved/changes
      if (initStatus === "Hyväksytty") {
        setTimeout(() => setApproved(item.id), 0);
      } else if (initStatus === "Muutoksia pyydetty") {
        setTimeout(() => setChanges(item.id), 0);
      }

      grid.appendChild(card);
    });
  }

  function setApproved(id) {
    const card = document.getElementById("card-" + id);
    if (!card) return;
    card.className = "content-card approved";
    const badge = document.getElementById("sbadge-" + id);
    if (badge) { badge.className = "status-badge status-approved"; badge.textContent = "Hyväksytty"; }
    const actions = document.getElementById("actions-" + id);
    const msg = document.getElementById("approved-msg-" + id);
    const fb = document.getElementById("feedback-" + id);
    if (actions) actions.style.display = "none";
    if (fb) fb.style.display = "none";
    if (msg) msg.style.display = "block";
  }

  function setChanges(id) {
    const card = document.getElementById("card-" + id);
    if (!card) return;
    card.className = "content-card changes";
    const badge = document.getElementById("sbadge-" + id);
    if (badge) { badge.className = "status-badge status-changes"; badge.textContent = "Muutoksia pyydetty"; }
    const fb = document.getElementById("feedback-" + id);
    if (fb) fb.style.display = "block";
  }

  function approveCard(id) {
    setApproved(id);
    // Lightweight Formspree ping for approval notification (no user input needed)
    const d = CLIENT_DATA;
    if (d.formspreeId && d.formspreeId !== "YOUR_FORMSPREE_ID") {
      fetch("https://formspree.io/f/" + d.formspreeId, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          _subject: "Hyväksyntä — " + d.clientName,
          client: d.clientName,
          action: "Hyväksytty",
          card_id: id,
        }),
      }).catch(() => {});
    }
  }

  function requestChanges(id) {
    setChanges(id);
  }

  function submitFeedback(id, formspreeId, caption) {
    const ta = document.getElementById("textarea-" + id);
    const msg = (ta && ta.value.trim()) ? ta.value.trim() : "(ei viestiä)";
    const d = CLIENT_DATA;

    if (!formspreeId || formspreeId === "YOUR_FORMSPREE_ID") {
      alert("Formspree-tunnus puuttuu. Ota yhteyttä RN Mediaan.");
      return;
    }

    fetch("https://formspree.io/f/" + formspreeId, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({
        _subject: "Muutospyyntö — " + d.clientName,
        client: d.clientName,
        card_id: id,
        caption: caption,
        feedback: msg,
      }),
    })
    .then(r => {
      const sentEl = document.getElementById("sent-" + id);
      if (r.ok) {
        if (sentEl) sentEl.style.display = "block";
        if (ta) ta.disabled = true;
        const submitBtn = ta && ta.nextElementSibling;
        if (submitBtn) submitBtn.disabled = true;
      } else {
        alert("Lähetys epäonnistui. Yritä uudelleen tai ota yhteyttä RN Mediaan.");
      }
    })
    .catch(() => alert("Verkkovirhe. Tarkista yhteys ja yritä uudelleen."));
  }

  // ── Init ───────────────────────────────────────────────────
  if (sessionStorage.getItem("fora_auth") === "1") {
    document.getElementById("pin-screen").style.display = "none";
    populateDashboard();
    document.getElementById("dashboard").classList.add("visible");
  }
</script>
</body>
</html>
