<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RN Media – Tarjousgeneraattori</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ── VARIABLES ─────────────────────────────────── */
    :root {
      --bg:      #0e0e0e;
      --surface: #161616;
      --s2:      #1c1c1c;
      --s3:      #222;
      --border:  #242424;
      --border2: #2e2e2e;
      --text:    #efefef;
      --muted:   #777;
      --muted2:  #3a3a3a;
      --white:   #ffffff;
      --r:       8px;
      --r-sm:    5px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* ── SHELL ─────────────────────────────────────── */
    .shell {
      display: grid;
      grid-template-columns: 340px 1fr;
      min-height: 100vh;
    }

    /* ── SIDEBAR ───────────────────────────────────── */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 36px 28px 40px;
      display: flex;
      flex-direction: column;
      gap: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .sidebar-name {
      font-family: 'Anton', sans-serif;
      font-size: 18px;
      letter-spacing: 0.05em;
      color: var(--white);
    }
    .sidebar-sep { width: 1px; height: 13px; background: var(--border2); }
    .sidebar-sub {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .form-section-title {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted2);
      margin-bottom: 14px;
      margin-top: 24px;
    }
    .form-section-title:first-of-type { margin-top: 0; }

    .field { margin-bottom: 14px; }
    .label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .input, .textarea, .select {
      width: 100%;
      background: var(--s2);
      border: 1px solid var(--border2);
      border-radius: var(--r-sm);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    .input:focus, .textarea:focus, .select:focus { border-color: #484848; }
    .input::placeholder, .textarea::placeholder { color: var(--muted2); }
    .textarea { resize: vertical; min-height: 72px; line-height: 1.55; }
    .select { cursor: pointer; appearance: none; -webkit-appearance: none; }
    .select option { background: #1c1c1c; }

    /* package radio cards */
    .pkg-options { display: flex; flex-direction: column; gap: 8px; }
    .pkg-option { position: relative; }
    .pkg-option input[type="radio"] {
      position: absolute; opacity: 0; width: 0; height: 0;
    }
    .pkg-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: var(--s2);
      border: 1px solid var(--border2);
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .pkg-option input:checked + .pkg-label {
      border-color: var(--white);
      background: var(--s3);
    }
    .pkg-label-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }
    .pkg-label-price {
      font-family: 'Anton', sans-serif;
      font-size: 14px;
      color: var(--muted);
    }
    .pkg-option input:checked + .pkg-label .pkg-label-price { color: var(--white); }

    /* date field */
    .input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.5);
      cursor: pointer;
    }

    .sidebar-actions {
      margin-top: auto;
      padding-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-generate {
      width: 100%;
      background: var(--white);
      color: #111;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 12px;
      border: none;
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-generate:hover { background: #e8e8e8; }
    .btn-generate:active { transform: scale(0.98); }
    .btn-print {
      width: 100%;
      background: transparent;
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 11px;
      border: 1px solid var(--border2);
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    .btn-print:hover { color: var(--text); border-color: #444; }

    /* ── PREVIEW PANE ──────────────────────────────── */
    .preview-pane {
      background: #1a1a1a;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 40px 80px;
      min-height: 100vh;
    }

    /* ── PROPOSAL SHEET ────────────────────────────── */
    .proposal {
      background: #111111;
      width: 794px;        /* A4 at 96dpi */
      min-height: 1123px;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 48px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    /* top accent bar */
    .proposal::before {
      content: '';
      display: block;
      height: 4px;
      background: var(--white);
      flex-shrink: 0;
    }

    .proposal-inner {
      padding: 52px 60px 48px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* ── PROPOSAL HEADER ───────────────────────────── */
    .p-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 44px;
    }
    .p-brand-name {
      font-family: 'Anton', sans-serif;
      font-size: 18px;
      letter-spacing: 0.06em;
      color: #ffffff;
      margin-bottom: 3px;
    }
    .p-brand-url {
      font-size: 11px;
      color: #555;
      font-weight: 400;
    }
    .p-meta {
      text-align: right;
    }
    .p-meta-line {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.07em;
      color: #444;
      line-height: 2;
      text-transform: uppercase;
    }
    .p-meta-line.highlight { color: #888; }

    /* ── HERO ──────────────────────────────────────── */
    .p-hero {
      margin-bottom: 36px;
    }
    .p-tag {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 12px;
    }
    .p-client-name {
      font-family: 'Anton', sans-serif;
      font-size: 54px;
      line-height: 1.0;
      letter-spacing: 0.01em;
      color: #ffffff;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .p-subtitle {
      font-size: 14px;
      font-weight: 300;
      color: #666;
      letter-spacing: 0.02em;
    }

    .p-rule {
      border: none;
      border-top: 1px solid #222;
      margin-bottom: 32px;
    }

    /* ── INTRO ─────────────────────────────────────── */
    .p-intro {
      font-size: 14px;
      font-weight: 300;
      line-height: 1.9;
      color: #cccccc;
      margin-bottom: 36px;
      max-width: 620px;
    }
    .p-intro strong { font-weight: 600; color: #efefef; }

    /* ── PACKAGE BLOCK ─────────────────────────────── */
    .p-package-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 32px;
    }

    .p-package-card {
      background: #181818;
      border: 1px solid #242424;
      border-radius: 8px;
      padding: 22px 22px 20px;
    }
    .p-pkg-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 6px;
    }
    .p-pkg-name {
      font-family: 'Anton', sans-serif;
      font-size: 28px;
      letter-spacing: 0.02em;
      color: #ffffff;
      margin-bottom: 2px;
    }
    .p-pkg-price {
      font-size: 13px;
      font-weight: 300;
      color: #888;
    }
    .p-pkg-price strong {
      font-family: 'Anton', sans-serif;
      font-size: 22px;
      color: #ffffff;
      font-weight: 400;
    }

    .p-includes-card {
      background: #181818;
      border: 1px solid #242424;
      border-radius: 8px;
      padding: 22px 22px 20px;
    }
    .p-inc-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 14px;
    }
    .p-inc-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .p-inc-list li {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-size: 12px;
      font-weight: 400;
      color: #bbbbbb;
      line-height: 1.4;
    }
    .p-inc-list li::before {
      content: '—';
      color: #444;
      flex-shrink: 0;
      font-size: 11px;
      margin-top: 1px;
    }

    /* ── PROCESS ───────────────────────────────────── */
    .p-process {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 32px;
    }
    .p-step {
      padding: 16px 16px 14px;
      background: #181818;
      border: 1px solid #222;
      border-radius: 8px;
    }
    .p-step-n {
      font-family: 'Anton', sans-serif;
      font-size: 32px;
      color: #2a2a2a;
      line-height: 1;
      margin-bottom: 6px;
    }
    .p-step-title {
      font-size: 12px;
      font-weight: 600;
      color: #e0e0e0;
      margin-bottom: 4px;
    }
    .p-step-desc {
      font-size: 11px;
      font-weight: 300;
      color: #666;
      line-height: 1.5;
    }

    /* ── FOOTER / SIGNATURE ────────────────────────── */
    .p-footer {
      margin-top: auto;
      padding-top: 28px;
      border-top: 1px solid #1e1e1e;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: end;
    }
    .p-sig-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #444;
      margin-bottom: 28px;
    }
    .p-sig-line {
      border-top: 1px solid #333;
      padding-top: 8px;
    }
    .p-sig-name {
      font-size: 12px;
      font-weight: 600;
      color: #888;
    }
    .p-sig-role {
      font-size: 10px;
      color: #444;
      margin-top: 2px;
    }
    .p-closing {
      text-align: right;
    }
    .p-closing-text {
      font-size: 12px;
      font-weight: 300;
      color: #555;
      line-height: 1.7;
    }
    .p-closing-text strong { color: #888; font-weight: 500; }

    /* ── EMPTY STATE ───────────────────────────────── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #333;
    }
    .empty-state svg { opacity: 0.3; }
    .empty-state-text { font-size: 13px; color: #444; }

    /* ── PRINT ─────────────────────────────────────── */
    @media print {
      @page { size: A4; margin: 0; }

      body, html {
        background: #111111 !important;
        width: 210mm;
        height: 297mm;
      }

      .shell { display: block; }
      .sidebar { display: none !important; }
      .preview-pane {
        padding: 0 !important;
        background: #111111 !important;
        display: block;
        min-height: unset;
      }

      .proposal {
        width: 210mm;
        min-height: 297mm;
        max-height: 297mm;
        box-shadow: none !important;
        overflow: hidden;
      }

      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }
  </style>
</head>
<body>

<div class="shell">

  <!-- ── SIDEBAR / FORM ─────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="sidebar-name">RN MEDIA</span>
      <div class="sidebar-sep"></div>
      <span class="sidebar-sub">Tarjous</span>
    </div>

    <div class="form-section-title">Asiakas</div>

    <div class="field">
      <label class="label" for="f-client">Yrityksen nimi</label>
      <input class="input" type="text" id="f-client" placeholder="Kahvila Koivu">
    </div>
    <div class="field">
      <label class="label" for="f-industry">Toimiala</label>
      <input class="input" type="text" id="f-industry" placeholder="Ravintola-ala">
    </div>
    <div class="field">
      <label class="label" for="f-desc">Yksi lause yrityksestä</label>
      <textarea class="textarea" id="f-desc" rows="3"
        placeholder="Tunnelmallinen kahvila Helsingin Kalliossa, erikoistunut specialty-kahviin."></textarea>
    </div>
    <div class="field">
      <label class="label" for="f-date">Tarjouksen päivämäärä</label>
      <input class="input" type="date" id="f-date">
    </div>

    <div class="form-section-title">Paketti</div>

    <div class="pkg-options">
      <div class="pkg-option">
        <input type="radio" name="package" id="pkg-starter" value="starter" checked>
        <label class="pkg-label" for="pkg-starter">
          <span class="pkg-label-name">Starter</span>
          <span class="pkg-label-price">299 €/kk</span>
        </label>
      </div>
      <div class="pkg-option">
        <input type="radio" name="package" id="pkg-growth" value="growth">
        <label class="pkg-label" for="pkg-growth">
          <span class="pkg-label-name">Growth</span>
          <span class="pkg-label-price">499 €/kk</span>
        </label>
      </div>
      <div class="pkg-option">
        <input type="radio" name="package" id="pkg-premium" value="premium">
        <label class="pkg-label" for="pkg-premium">
          <span class="pkg-label-name">Premium</span>
          <span class="pkg-label-price">799 €/kk</span>
        </label>
      </div>
    </div>

    <div class="sidebar-actions">
      <button class="btn-generate" onclick="generate()">Päivitä tarjous →</button>
      <button class="btn-print" onclick="window.print()">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
          <path d="M4 6V1.5A.5.5 0 014.5 1h7a.5.5 0 01.5.5V6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <rect x="1" y="6" width="14" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M4 10h8M4 12.5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="12.5" cy="8.5" r="1" fill="currentColor"/>
        </svg>
        Tallenna PDF:nä
      </button>
    </div>
  </aside>

  <!-- ── PREVIEW PANE ───────────────────────────────── -->
  <div class="preview-pane">
    <div class="proposal" id="proposal">
      <div class="proposal-inner">
        <div class="empty-state" id="empty-state">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
          <div class="empty-state-text">Täytä lomake ja paina "Päivitä tarjous"</div>
        </div>
        <div id="proposal-content" style="display:none; flex:1; display:none; flex-direction:column;"></div>
      </div>
    </div>
  </div>

</div>

<script>
  // Set today's date as default
  document.getElementById('f-date').value = new Date().toISOString().slice(0, 10);

  const PACKAGES = {
    starter: {
      name: 'STARTER',
      price: '299',
      tagline: 'Täydellinen aloituspaketti',
      items: [
        '8 some-postausta kuukaudessa',
        'Instagram & TikTok -hallinta',
        'Kuvatekstit ja hashtagit',
        'Kuukausiraportti',
        'Oma yhteyshenkilö',
      ],
      intro_extra: 'Starter-paketilla pääsette liikkeelle nopeasti — me hoidamme sisällön alusta loppuun.',
    },
    growth: {
      name: 'GROWTH',
      price: '499',
      tagline: 'Kasvuun tähtäävä kokonaisuus',
      items: [
        '16 some-postausta kuukaudessa',
        'Instagram, TikTok & Facebook',
        'Reels- ja videosisällöt',
        'Kuukausiraportti + strategia',
        'Mainoskampanjoiden hallinta',
        'Oma yhteyshenkilö',
      ],
      intro_extra: 'Growth-paketti on suunniteltu yrityksille, jotka haluavat kasvattaa näkyvyyttään systemaattisesti.',
    },
    premium: {
      name: 'PREMIUM',
      price: '799',
      tagline: 'Täyden palvelun somemarkkinointi',
      items: [
        '30 some-postausta kuukaudessa',
        'Kaikki alustat kattavasti',
        'Ammattimaiset videot & Reels',
        'Mainoskampanjat + budjetointi',
        'Viikoittainen raportointi',
        'Brändistrategia & kehitys',
        'Prioriteettiasiakas — nopea tuki',
      ],
      intro_extra: 'Premium on täyden palvelun pakettimme — kaikki somemarkkinointinne yhdellä kertaa hoidossa.',
    },
  };

  function fmtDate(dateStr) {
    if (!dateStr) return '';
    const [y, m, d] = dateStr.split('-');
    return `${d}.${m}.${y}`;
  }

  function buildIntro(client, industry, desc, pkg) {
    const p = PACKAGES[pkg];
    const industryMap = {
      'ravintola': 'ravintola-alalla', 'kahvila': 'kahvila-alalla',
      'muoti': 'muotialalla', 'kauneus': 'kauneusalalla',
      'hyvinvointi': 'hyvinvointialalla', 'fitness': 'fitness-alalla',
      'rakennus': 'rakennusalalla', 'teknologia': 'teknologia-alalla',
      'kiinteistö': 'kiinteistöalalla', 'terveys': 'terveydenhuollossa',
    };
    const industryLower = industry.toLowerCase();
    let industryPhrase = '';
    for (const [key, val] of Object.entries(industryMap)) {
      if (industryLower.includes(key)) { industryPhrase = val; break; }
    }
    if (!industryPhrase) industryPhrase = `${industry.toLowerCase()}alalla`;

    return `<strong>${client}</strong> on brändi, jolla on selkeä identiteetti ja aito tarina kerrottavana. ${desc ? desc.trim().replace(/\.$/, '') + ' —' : ''} juuri sellainen yritys, jonka some-potentiaali on valtava. ${industryPhrase.charAt(0).toUpperCase() + industryPhrase.slice(1)} kilpailu näkyvyydestä on kovaa, mutta oikealla sisällöllä erotutaan. ${p.intro_extra} Tavoitteena on rakentaa teille johdonmukainen some-läsnäolo, joka tuo uusia asiakkaita ja vahvistaa brändinne asemaa.`;
  }

  function generate() {
    const client   = document.getElementById('f-client').value.trim() || 'Asiakas';
    const industry = document.getElementById('f-industry').value.trim() || 'Yritys';
    const desc     = document.getElementById('f-desc').value.trim();
    const dateVal  = document.getElementById('f-date').value;
    const pkg      = document.querySelector('input[name="package"]:checked').value;
    const p        = PACKAGES[pkg];

    const intro = buildIntro(client, industry, desc, pkg);

    const itemsHtml = p.items.map(i => `<li>${i}</li>`).join('');

    const html = `
      <div class="p-header">
        <div>
          <div class="p-brand-name">RN MEDIA</div>
          <div class="p-brand-url">rnmedia.fi</div>
        </div>
        <div class="p-meta">
          <div class="p-meta-line">Tarjous</div>
          <div class="p-meta-line highlight">${fmtDate(dateVal)}</div>
          <div class="p-meta-line">${industry}</div>
        </div>
      </div>

      <div class="p-hero">
        <div class="p-tag">Tarjous asiakkaalle</div>
        <div class="p-client-name">${escHtml(client)}</div>
        <div class="p-subtitle">${escHtml(industry)} · ${p.tagline}</div>
      </div>

      <hr class="p-rule">

      <div class="p-intro">${intro}</div>

      <div class="p-package-wrap">
        <div class="p-package-card">
          <div class="p-pkg-label">Valittu paketti</div>
          <div class="p-pkg-name">${p.name}</div>
          <div class="p-pkg-price"><strong>${p.price} €</strong> / kuukausi</div>
        </div>
        <div class="p-includes-card">
          <div class="p-inc-label">Sisältyy pakettiin</div>
          <ul class="p-inc-list">${itemsHtml}</ul>
        </div>
      </div>

      <div class="p-process">
        <div class="p-step">
          <div class="p-step-n">01</div>
          <div class="p-step-title">Aloituspalaveri</div>
          <div class="p-step-desc">Käymme läpi brändinnne, tavoitteet ja kohderyhmän.</div>
        </div>
        <div class="p-step">
          <div class="p-step-n">02</div>
          <div class="p-step-title">Sisältöstrategia</div>
          <div class="p-step-desc">Luomme räätälöidyn suunnitelman ja visuaalisen ilmeen.</div>
        </div>
        <div class="p-step">
          <div class="p-step-n">03</div>
          <div class="p-step-title">Tuotanto & julkaisu</div>
          <div class="p-step-desc">Hoidamme sisällöt alusta loppuun — te keskitytte liiketoimintaan.</div>
        </div>
      </div>

      <div class="p-footer">
        <div>
          <div class="p-sig-label">Hyväksyminen</div>
          <div class="p-sig-line">
            <div class="p-sig-name">Nikolas / RN Media</div>
            <div class="p-sig-role">nikolas.ruotsalo@rnmedia.fi · rnmedia.fi</div>
          </div>
        </div>
        <div class="p-closing">
          <div class="p-closing-text">
            Tarjous voimassa <strong>14 päivää</strong>.<br>
            Aloitus sopimuksen allekirjoituksesta.<br>
            Ei sitoutumisaikaa — 30 pv irtisanomisaika.
          </div>
        </div>
      </div>
    `;

    const content = document.getElementById('proposal-content');
    const empty   = document.getElementById('empty-state');
    content.innerHTML = html;
    content.style.display = 'flex';
    content.style.flexDirection = 'column';
    empty.style.display = 'none';
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Live update on any input change
  document.querySelectorAll('.input, .textarea, input[type="radio"]').forEach(el => {
    el.addEventListener('input', () => {
      if (document.getElementById('proposal-content').style.display !== 'none') generate();
    });
    el.addEventListener('change', () => {
      if (document.getElementById('proposal-content').style.display !== 'none') generate();
    });
  });

  // Enter key
  document.querySelectorAll('.input').forEach(el => {
    el.addEventListener('keydown', e => { if (e.key === 'Enter') generate(); });
  });
</script>
